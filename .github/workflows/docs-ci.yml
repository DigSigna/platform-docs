name: Documentation Quality Assurance

on:
  push:
    branches: [ main, dev, features/* ]
  pull_request:
    branches: [ main, dev ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  documentation-integrity:
    name: 📚 Documentación y Arquitectura
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔗 Validar links en documentación
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.mlc_config.json'

    - name: 🎨 Validar diagramas de arquitectura (recursivo)
      run: |
        echo "## 🔍 Validación de Diagramas" >> $GITHUB_STEP_SUMMARY
        
        # Buscar recursivamente en toda la estructura
        PUML_FILES=$(find . -name "*.puml" -path "*/*" 2>/dev/null | wc -l)
        echo "Encontrados $PUML_FILES archivos .puml" >> $GITHUB_STEP_SUMMARY
        
        if [ "$PUML_FILES" -eq 0 ]; then
          echo "⚠️  No se encontraron diagramas .puml" >> $GITHUB_STEP_SUMMARY
        else
          echo "### Diagramas encontrados:" >> $GITHUB_STEP_SUMMARY
          find . -name "*.puml" -path "*/*" 2>/dev/null -exec echo "- {}" \; >> $GITHUB_STEP_SUMMARY
          
          # Validación básica de contenido
          EMPTY_FILES=0
          for file in $(find . -name "*.puml" -path "*/*" 2>/dev/null); do
            if [ ! -s "$file" ]; then
              echo "❌ $file está vacío" >> $GITHUB_STEP_SUMMARY
              EMPTY_FILES=$((EMPTY_FILES + 1))
            fi
          done
          
          if [ "$EMPTY_FILES" -gt 0 ]; then
            echo "❌ Se encontraron $EMPTY_FILES diagramas vacíos" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        fi

    - name: 📊 Generar reporte de documentación
      run: |
        echo "## 📊 Métricas de Documentación" >> $GITHUB_STEP_SUMMARY
        echo "- 📄 Archivos Markdown: $(find docs -name "*.md" 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY  
        echo "- 🎨 Diagramas PlantUML: $(find docs -name "*.puml" 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
        echo "- 📝 ADRs creados: $(find docs -name "*.md" -path "*/adr/*" 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY

  security-validation:
    name: 🔒 Seguridad Básica
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout código
      uses: actions/checkout@v4

    - name: 🔍 Escaneo de secretos básico
      run: |
        echo "## 🔍 Escaneo de Secretos" >> $GITHUB_STEP_SUMMARY
        FOUND_SECRETS=0
        
        # Patrones simples y confiables para secretos
        echo "Buscando patrones de contraseñas..."
        if grep -r --include="*.md" --include="*.yaml" --include="*.yml" -i -E "password\s*[=:]\s*['\\\"][^[:space:]]+" .; then
          echo "❌ Posible contraseña expuesta" >> $GITHUB_STEP_SUMMARY
          FOUND_SECRETS=1
        fi
        
        echo "Buscando patrones de API keys..."
        if grep -r --include="*.md" --include="*.yaml" --include="*.yml" -i -E "api[_-]?key\s*[=:]\s*['\\\"][^[:space:]]+" .; then
          echo "❌ Posible API key expuesta" >> $GITHUB_STEP_SUMMARY
          FOUND_SECRETS=1
        fi
        
        # Patrón adicional para tokens
        echo "Buscando patrones de tokens..."
        if grep -r --include="*.md" --include="*.yaml" --include="*.yml" -i -E "token\s*[=:]\s*['\\\"][^[:space:]]+" .; then
          echo "❌ Posible token expuesto" >> $GITHUB_STEP_SUMMARY
          FOUND_SECRETS=1
        fi
        
        if [ "$FOUND_SECRETS" -eq 0 ]; then
          echo "✅ No se encontraron secretos expuestos" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Se encontraron posibles secretos. Revisa los logs." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: 📝 Validar spelling
      uses: codespell-project/actions-codespell@v2
