name: Documentation Quality Assurance

on:
  push:
    branches: [ main, dev, features/* ]
  pull_request:
    branches: [ main, dev ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  documentation-integrity:
    name: Documentation and Architecture
    runs-on: ubuntu-latest

    steps:
    - name: Code checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Documentation link validation
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.mlc_config.json'

    - name: Architecture diagrams validation (recursive)
      run: |
        echo "## Diagrams validation" >> $GITHUB_STEP_SUMMARY

        PUML_FILES=$(find . -name "*.puml" -not -path "./.git/*" | wc -l)
        echo " $PUML_FILES .puml files found" >> $GITHUB_STEP_SUMMARY

        if [ "$PUML_FILES" -eq 0 ]; then
          echo ".puml files not found" >> $GITHUB_STEP_SUMMARY
        else
          echo "### Diagrams found:" >> $GITHUB_STEP_SUMMARY
          find . -name "*.puml" -not -path "./.git/*" -exec echo "- {}" \; >> $GITHUB_STEP_SUMMARY

          EMPTY_FILES=0
          while IFS= read -r file; do
            if [ ! -s "$file" ]; then
              echo "❌ $file empty" >> $GITHUB_STEP_SUMMARY
              EMPTY_FILES=$((EMPTY_FILES + 1))
            fi
          done < <(find . -name "*.puml" -not -path "./.git/*")

          if [ "$EMPTY_FILES" -gt 0 ]; then
            echo "❌ $EMPTY_FILES diagrams empty found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        fi

    - name: Documentation reporting
      run: |
        echo "## Documentation metrics" >> $GITHUB_STEP_SUMMARY
        echo "- Markdown files: $(find . -name "*.md" -not -path "./.git/*" | wc -l)" >> $GITHUB_STEP_SUMMARY
        echo "- PlantUML Diagrama: $(find . -name "*.puml" -not -path "./.git/*" | wc -l)" >> $GITHUB_STEP_SUMMARY
        echo "- ADRs: $(find . -iname "DLT-*.md" -not -path "./.git/*" | wc -l)" >> $GITHUB_STEP_SUMMARY

  security-validation:
    name: Basic Security Validation
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Secrets scan (gitleaks)
      # Reemplaza el grep casero anterior, que daba falso positivo con
      # entradas de documentación legítimas como `access_token: "15 minutos"`.
      # Usa la configuración que ya existe en .gitleaks.toml en la raíz del repo.
      env:
        # Versión fijada a propósito: resolver "latest" vía api.github.com sin autenticación
        # está sujeto a rate limit (60 req/hora) en la IP compartida de los runners de GitHub
        # Actions, lo que puede volver a poner el CI en rojo de forma intermitente. Actualizar
        # esta versión manualmente cada cierto tiempo (ver https://github.com/gitleaks/gitleaks/releases).
        GITLEAKS_VERSION: '8.30.1'
      run: |
        echo "## Secrets scan (gitleaks v${GITLEAKS_VERSION})" >> $GITHUB_STEP_SUMMARY

        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
        tar -xzf gitleaks.tar.gz gitleaks

        if ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose; then
          echo "✅ No secrets found" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ gitleaks found posible secrets. Check the step logs." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Spelling validating (informative)
      # No bloqueante a propósito: este repo mezcla español e inglés según convención
      # (nombres de archivo en inglés, contenido histórico en español), y el diccionario
      # en inglés de codespell no distingue eso. Se reporta como referencia, no como gate.
      continue-on-error: true
      uses: codespell-project/actions-codespell@v2
      with:
        ignore_words_file: .codespellignore
        skip: "*.puml,*.json"
        check_filenames: false
        check_hidden: false