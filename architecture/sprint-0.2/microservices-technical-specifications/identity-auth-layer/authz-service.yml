Tecnología: Spring Boot 3 + OPA (Open Policy Agent)
Base de Datos: PostgreSQL (schema authz_tenant_{id})
Modelo de Autorización:
  - RBAC (Role-Based Access Control)
  - ABAC (Attribute-Based Access Control)
  - Políticas JSON-based

Estructura Roles:
  - firmante: Firmar documentos
  - validador: Validar firmas
  - admin_tenant: Administrar tenant
  - auditor: Acceso auditoría
  - super_admin: Administración plataforma

APIs:
  - POST /api/v1/policies          # Crear política
  - GET  /api/v1/check             # Verificar acceso
  - PUT  /api/v1/roles/{id}/users  # Asignar roles